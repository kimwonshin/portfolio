<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">HEAR 인터페이스 콘셉트 목업</title>
  <desc id="desc">AI 대화, 감정 태그, 이미지가 포함된 일기 화면을 표현한 교체용 콘셉트 이미지</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f1df"/>
      <stop offset="1" stop-color="#fffaf1"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9acd9"/>
      <stop offset=".52" stop-color="#f0b7ad"/>
      <stop offset="1" stop-color="#f3d77a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#554c40" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/>
  <circle cx="1260" cy="80" r="220" fill="#f3d77a" opacity=".3"/>
  <circle cx="100" cy="820" r="250" fill="#b9acd9" opacity=".18"/>
  <g opacity=".28" stroke="#877b69">
    <path d="M0 110h1400M0 220h1400M0 330h1400M0 440h1400M0 550h1400M0 660h1400M0 770h1400"/>
  </g>
  <text x="82" y="92" fill="#4d4338" font-family="Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="7">HEAR · CONCEPT MOCKUP</text>
  <text x="82" y="132" fill="#887b68" font-family="Arial, sans-serif" font-size="18">실제 제품 캡처로 교체하기 위한 임시 시각 자료</text>

  <g transform="translate(92 190)" filter="url(#shadow)">
    <rect width="520" height="620" rx="28" fill="#fffdf7" stroke="#cdbfae"/>
    <rect x="34" y="34" width="452" height="70" rx="18" fill="#4d4338"/>
    <circle cx="73" cy="69" r="15" fill="#f3d77a"/>
    <text x="106" y="77" fill="#fffaf1" font-family="Arial, sans-serif" font-size="24" font-weight="700">오늘 하루는 어땠나요?</text>
    <rect x="34" y="140" width="350" height="72" rx="18" fill="#eee6d6"/>
    <text x="56" y="171" fill="#564b40" font-family="Arial, sans-serif" font-size="17">발표를 마치고 나니 후련하면서도</text>
    <text x="56" y="197" fill="#564b40" font-family="Arial, sans-serif" font-size="17">조금 아쉬웠어.</text>
    <rect x="136" y="236" width="350" height="95" rx="18" fill="#f4d97e"/>
    <text x="160" y="270" fill="#564b40" font-family="Arial, sans-serif" font-size="17">수고했어요. 오늘 가장 기억에 남은</text>
    <text x="160" y="297" fill="#564b40" font-family="Arial, sans-serif" font-size="17">장면을 하나만 더 들려줄래요?</text>
    <rect x="34" y="380" width="452" height="172" rx="22" fill="#f4f0e8" stroke="#d5c9b8"/>
    <text x="56" y="418" fill="#4d4338" font-family="Arial, sans-serif" font-size="18" font-weight="700">AI가 정리 중이에요</text>
    <g transform="translate(56 448)">
      <rect width="112" height="34" rx="17" fill="#d9cfee"/>
      <text x="20" y="23" fill="#564b40" font-family="Arial, sans-serif" font-size="14">#성취감</text>
      <rect x="124" width="112" height="34" rx="17" fill="#f3d77a"/>
      <text x="144" y="23" fill="#564b40" font-family="Arial, sans-serif" font-size="14">#아쉬움</text>
      <rect x="248" width="116" height="34" rx="17" fill="#e8b9b1"/>
      <text x="267" y="23" fill="#564b40" font-family="Arial, sans-serif" font-size="14">#발표완료</text>
    </g>
    <rect x="56" y="507" width="294" height="12" rx="6" fill="#d4c9b9"/>
    <rect x="56" y="528" width="220" height="10" rx="5" fill="#e3dacd"/>
  </g>

  <g transform="translate(698 178)" filter="url(#shadow)">
    <rect width="610" height="646" rx="30" fill="#fffdf7" stroke="#cdbfae"/>
    <text x="42" y="66" fill="#4d4338" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">OCT 19 · SUNDAY</text>
    <text x="42" y="112" fill="#4d4338" font-family="Arial, sans-serif" font-size="34" font-weight="700">한 걸음 끝낸 날</text>
    <rect x="42" y="148" width="526" height="270" rx="24" fill="url(#art)"/>
    <circle cx="436" cy="240" r="72" fill="#fff3cf" opacity=".72"/>
    <path d="M80 364c80-96 150-90 220-18 58-78 130-87 226 18" fill="none" stroke="#fffdf7" stroke-width="24" stroke-linecap="round" opacity=".58"/>
    <path d="M120 250c48-54 104-56 159-9" fill="none" stroke="#5d5165" stroke-width="8" stroke-linecap="round" opacity=".55"/>
    <rect x="42" y="452" width="90" height="34" rx="17" fill="#d9cfee"/>
    <text x="61" y="475" fill="#564b40" font-family="Arial, sans-serif" font-size="14">#성취감</text>
    <rect x="142" y="452" width="88" height="34" rx="17" fill="#f3d77a"/>
    <text x="162" y="475" fill="#564b40" font-family="Arial, sans-serif" font-size="14">#회고</text>
    <rect x="240" y="452" width="116" height="34" rx="17" fill="#e8b9b1"/>
    <text x="258" y="475" fill="#564b40" font-family="Arial, sans-serif" font-size="14">#발표완료</text>
    <text x="42" y="533" fill="#564b40" font-family="Arial, sans-serif" font-size="18">오늘은 준비한 발표를 끝냈다. 긴장했지만</text>
    <text x="42" y="565" fill="#564b40" font-family="Arial, sans-serif" font-size="18">마지막까지 내 이야기를 전할 수 있어 후련했다.</text>
    <text x="42" y="606" fill="#9b8d79" font-family="Arial, sans-serif" font-size="14">AI IMAGE · HASHTAGS · STICKER</text>
  </g>
</svg>
